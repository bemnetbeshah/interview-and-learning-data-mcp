[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-prep-mcp"
version = "0.1.0"
description = "Hosted MCP server for shared interview prep progress and spaced repetition."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.9.0,<2",
  "pydantic>=2.0",
  "psycopg[binary]>=3.2",
  "pyjwt[crypto]>=2.10.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
interview-prep-mcp = "interview_prep_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
